<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hrv Clan - Share Code</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="author" content="hrv clan">
<meta name="theme-color" content="#ff5000">
<meta property="og:image" content="/favicon.png">
<meta property="og:locale" content="vi_VN">
<meta property="og:site_name" content="Hrv Clan">
<meta property="og:title" content="Share Code">
<meta property="og:description" content="nơi lưu trữ và chia sẽ mã nguồn của Hrv Clan.">
<style>
:root{--bg-main:#010409;--bg-glass:rgba(22,27,34,0.8);--bg-card:#161b22;--border:#30363d;--accent:#58a6ff;--success:#3fb950;--text-gray:#8b949e}body{background-color:var(--bg-main);color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:20px;display:flex;justify-content:center}.container{width:100%;max-width:800px;animation:fadeIn .8s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.navbar{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--bg-glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:15px}.brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent)}.brand-name{font-size:22px;font-weight:900;background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.section-title{font-size:14px;font-weight:700;color:#ff79c6;margin:20px 0 10px 5px;text-transform:uppercase}.var-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:30px;min-height:50px}.var-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(48,54,61,0.5)}.var-name{color:#50fa7b;font-family:monospace}.var-value{color:#f1fa8c;font-family:monospace}.cmd-container{margin-bottom:35px}.cmd-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.cmd-trigger{background:linear-gradient(135deg,#238636,#2ea043);color:#fff;padding:4px 15px;border-radius:20px;font-size:13px;font-weight:700}.code-wrapper{position:relative;background:#000;border:1px solid var(--border);border-radius:15px;padding:25px;padding-top:55px;transition:.3s}.code-wrapper:hover{border-color:var(--accent)}.copy-btn{position:absolute;top:15px;right:15px;background:#21262d;border:1px solid var(--border);color:#c9d1d9;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;transition:.2s}.copy-btn:hover{background:var(--accent);color:#000}.icon-check{display:none;color:var(--success)}#manual-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;padding:20px}.modal-content{background:var(--bg-card);border:1px solid var(--border);padding:20px;border-radius:15px;width:100%;max-width:500px}.modal-content textarea{width:100%;height:150px;background:#000;color:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px}.code-content{white-space:pre-wrap;font-family:'Consolas',monospace;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="container">
<div class="navbar">
<div class="brand">
<img src="/favicon.png" alt="Logo">
<span class="brand-name">Hrv Clan</span>
</div>
<div style="font-size: 11px; color: var(--text-gray); font-weight: bold;">share code.</div>
</div>
<div class="project-info">
<h1 id="ui-name">Loading...</h1>
<p id="ui-desc" style="color: var(--text-gray);"></p>
</div>
<div class="section-title">Variables</div>
<div class="var-card" id="ui-vars">
<div style="color:var(--text-gray); font-size:13px; text-align:center">Đang tải biến...</div>
</div>
<div id="ui-codes"></div>
</div>
<div id="manual-modal" onclick="this.style.display='none'">
<div class="modal-content" onclick="event.stopPropagation()">
<h3 style="margin-top:0; color: var(--accent);">⚠️ Error Copy!</h3>
<p style="font-size: 13px;">không thể sao chép, hãy sau chép thủ công!</p>
<textarea id="manual-text" readonly></textarea>
<button onclick="document.getElementById('manual-modal').style.display='none'" style="margin-top:15px; width:100%; padding:10px; border-radius:8px; border:none; background: var(--accent); font-weight:bold; cursor:pointer">Đóng</button>
</div>
</div>
<script>
const theme={defaultText:4288341353,fallback:4285791231,bracket:4294921292,semi:4294920266,logic:4288905212,nomention:4294932473};function getClr(e){return`rgba(${e>>16&255}, ${e>>8&255}, ${255&e}, ${(e>>24&255)/255})`}function highlight(e){let t=e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return t=t.replace(/([\[\]])/g,`<span style="color: ${getClr(theme.bracket)}">$1</span>`),t=t.replace(/(;)/g,`<span style="color: ${getClr(theme.semi)}">$1</span>`),["$if","$else","$endif","$try","$catch","$error","$endtry","$elseif"].forEach(e=>{const n=new RegExp("\\"+e+"(?=[\\s\\[]|$)","g");t=t.replace(n,`<span style="color: ${getClr(theme.logic)}">${e}</span>`)}),t=t.replace(/\$nomention/g,`<span style="color: ${getClr(theme.nomention)}">$nomention</span>`),t=t.replace(/(?<!style="[^"]*")(\$[a-zA-Z0-9_]+)/g,`<span style="color: ${getClr(theme.fallback)}">$1</span>`),`<div style="color: ${getClr(theme.defaultText)}">${t}</div>`}async function initSystem(){try{const e=await fetch("./info.json");if(!e.ok)throw new Error("Không tìm thấy info.json");const t=await e.json();document.getElementById("ui-name").innerText=t.name||"BDFD Project",document.getElementById("ui-desc").innerText=t.description||"Không có mô tả.";const n=document.getElementById("ui-vars");t.variables&&t.variables.length>0?(n.innerHTML="",t.variables.forEach(e=>{n.innerHTML+=`<div class="var-row"><span class="var-name">${e.name}</span><span class="var-value">${e.value}</span></div>`})):n.innerHTML='<div style="color:var(--text-gray); font-size:13px; text-align:center">lệnh này không yêu cầu biến.</div>';const o=document.getElementById("ui-codes");for(const e of t.commands)try{const t=await fetch(`./${e.id}.bdfd`),n=await t.text(),c=document.createElement("div");c.className="cmd-container",c.innerHTML=`\n                        <div class="cmd-header">\n                            <span style="color:var(--text-gray); font-size: 11px;">#ID: ${e.id}</span>\n                            <span class="cmd-trigger">${e.trigger}</span>\n                        </div>\n                        <div class="code-wrapper">\n                            <button class="copy-btn" onclick="vipCopy(this)">\n                                <svg class="icon-copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>\n                                <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="display:none; color:var(--success)"><polyline points="20 6 9 17 4 12"></polyline></svg>\n                            </button>\n                            <div class="code-content">${highlight(n)}</div>\n                        </div>`,o.appendChild(c)}catch(t){console.error(`Lỗi tải file code ${e.id}.bdfd`,t)}}catch(e){document.getElementById("ui-name").innerText="Lỗi hệ thống",document.getElementById("ui-desc").innerText="Vui lòng kiểm tra lại file info.json và các file .bdfd",console.error(e)}}function vipCopy(e){const t=e.parentElement.querySelector(".code-content").innerText,n=e.querySelector(".icon-copy"),o=e.querySelector(".icon-check"),c=()=>{n.style.display="none",o.style.display="block",e.style.background="var(--success)",e.style.color="#000",setTimeout(()=>{n.style.display="block",o.style.display="none",e.style.background="",e.style.color=""},2e3)};navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(t).then(c).catch(()=>fallbackCopy(t,c)):fallbackCopy(t,c)}function fallbackCopy(e,t){const n=document.createElement("textarea");n.value=e,Object.assign(n.style,{position:"fixed",left:"-9999px",top:"0"}),document.body.appendChild(n),n.focus(),n.select();try{if(!document.execCommand("copy"))throw new Error;t()}catch(t){document.getElementById("manual-text").value=e,document.getElementById("manual-modal").style.display="flex"}document.body.removeChild(n)}initSystem();
</script>
</body>
</html>
