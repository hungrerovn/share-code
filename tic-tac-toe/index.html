<!DOCTYPE html><html lang="vi"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hrv Clan - Share Code</title> <link rel="icon" type="image/png" href="/favicon.png"> <meta name="author" content="hrv clan"> <meta name="theme-color" content="#ff5000"> <meta property="og:image" content="/favicon.png"> <meta property="og:locale" content="vi_VN"> <meta property="og:site_name" content="Hrv Clan"> <meta property="og:title" content="Share Code"> <meta property="og:description" content="nơi lưu trữ và chia sẽ mã nguồn của Hrv Clan."> <style>{--bg-main:#010409;--bg-glass:rgba(22, 27, 34, 0.8);--bg-card:#161b22;--border:#30363d;--accent:#58a6ff;--success:#3fb950;--text-gray:#8b949e;}body{background-color:var(--bg-main);color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:20px;display:flex;justify-content:center;}.container{width:100%;max-width:800px;animation:fadeIn 0.8s ease;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}.navbar{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--bg-glass);backdrop-filter: blur(10px);border:1px solid var(--border);border-radius:12px;margin-bottom:30px;}.brand{display:flex;align-items:center;gap:15px;}.brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);}.brand-name{font-size:22px;font-weight:900;background:linear-gradient(90deg, #fff, var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.section-title{font-size:14px;font-weight:bold;color:#ff79c6;margin:20px 0 10px 5px;text-transform:uppercase;}.var-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:30px;min-height:50px;}.var-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(48, 54, 61, 0.5);}.var-name{color:#50fa7b;font-family:monospace;}.var-value{color:#f1fa8c;font-family:monospace;}.cmd-container{margin-bottom:35px;}.cmd-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}.cmd-trigger{background:linear-gradient(135deg, #238636, #2ea043);color:white;padding:4px 15px;border-radius:20px;font-size:13px;font-weight:bold;}.code-wrapper{position:relative;background:#000;border:1px solid var(--border);border-radius:15px;padding:55px 25px 25px;transition:0.3s;}.code-wrapper:hover{border-color:var(--accent);}.copy-btn{position:absolute;top:15px;right:15px;background:#21262d;border:1px solid var(--border);color:#c9d1d9;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;transition:0.2s;}.copy-btn:hover{background:var(--accent);color:#000;}.icon-check{display:none;color:var(--success);}#manual-modal{display:none;position:fixed;inset:0;background:rgba(0, 0, 0, 0.8);z-index:100;align-items:center;justify-content:center;padding:20px;}.modal-content{background:var(--bg-card);border:1px solid var(--border);padding:20px;border-radius:15px;width:100%;max-width:500px;}.modal-content textarea{width:100%;height:150px;background:#000;color:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;}.code-content{white-space:pre-wrap;font-family:'Consolas',monospace;font-size:14px;line-height:1.8;}</style></head><body><div class="container"><div class="navbar"><div class="brand"> <img src="/favicon.png" alt="Logo"><span class="brand-name">Hrv Clan</span></div><div style="font-size: 11px; color: var(--text-gray); font-weight: bold;">PREMIUM RESOURCE</div></div><div class="project-info"><h1 id="ui-name">Loading...</h1><p id="ui-desc" style="color: var(--text-gray);"></p></div><div class="section-title">Variables</div><div class="var-card" id="ui-vars"><div style="color:var(--text-gray); font-size:13px; text-align:center">Đang tải biến...</div></div><div id="ui-codes"></div></div><div id="manual-modal" onclick="this.style.display='none'"><div class="modal-content" onclick="event.stopPropagation()"><h3 style="margin-top:0; color: var(--accent);">⚠️ Error Copy!</h3><p style="font-size: 13px;">không thể sao chép, hãy sau chép thủ công!</p><textarea id="manual-text" readonly></textarea><button onclick="document.getElementById('manual-modal').style.display='none'" style="margin-top:15px; width:100%; padding:10px; border-radius:8px; border:none; background: var(--accent); font-weight:bold; cursor:pointer">Đóng</button></div></div><script>const theme={defaultText:4288341353,fallback:4285791231,bracket:4294921292,semi:4294920266,logic:4288905212,nomention:4294932473};function getClr(d){const a=((d>>24)&0xFF)/255;const r=(d>>16)&0xFF;const g=(d>>8)&0xFF;const b=d&0xFF;return`rgba(${r}, ${g}, ${b}, ${a})`}function highlight(input){let h=input.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");h=h.replace(/([\[\]])/g,`<span style="color: ${getClr(theme.bracket)}">$1</span>`);h=h.replace(/(;)/g,`<span style="color: ${getClr(theme.semi)}">$1</span>`);["$if","$else","$endif","$try","$catch","$error","$endtry","$elseif"].forEach(f=>{const reg=new RegExp('\\'+f+'(?=[\\s\\[]|$)','g');h=h.replace(reg,`<span style="color: ${getClr(theme.logic)}">${f}</span>`)});h=h.replace(/\$nomention/g,`<span style="color: ${getClr(theme.nomention)}">$nomention</span>`);h=h.replace(/(?<!style="[^"]*")(\$[a-zA-Z0-9_]+)/g,`<span style="color: ${getClr(theme.fallback)}">$1</span>`);return`<div style="color: ${getClr(theme.defaultText)}">${h}</div>`}async function initSystem(){try{const infoRes=await fetch('./info.json');if(!infoRes.ok)throw new Error("Không tìm thấy info.json");const info=await infoRes.json();document.getElementById('ui-name').innerText=info.name||"BDFD Project";document.getElementById('ui-desc').innerText=info.description||"Không có mô tả.";const varBox=document.getElementById('ui-vars');if(info.variables&&info.variables.length>0){varBox.innerHTML='';info.variables.forEach(v=>{varBox.innerHTML+=`<div class="var-row"><span class="var-name">${v.name}</span><span class="var-value">${v.value}</span></div>`})}else{varBox.innerHTML='<div style="color:var(--text-gray); font-size:13px; text-align:center">Lệnh này không yêu cầu biến.</div>'}const codeC=document.getElementById('ui-codes');for(const cmdof info.commands){try{const codeRes=await fetch(`./${cmd.id}.bdfd`);const codeText=await codeRes.text();const div=document.createElement('div');div.className='cmd-container';div.innerHTML=`
                        <div class="cmd-header">
                            <span style="color:var(--text-gray); font-size: 11px;">#ID: ${cmd.id}</span>
                            <span class="cmd-trigger">${cmd.trigger}</span>
                        </div>
                        <div class="code-wrapper">
                            <button class="copy-btn" onclick="vipCopy(this)">
                                <svg class="icon-copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                                <svg class="icon-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="display:none; color:var(--success)"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>
                            <div class="code-content">${highlight(codeText)}</div>
                        </div>`;codeC.appendChild(div)}catch(err){console.error(`Lỗi tải file code ${cmd.id}.bdfd`,err)}}}catch(e){document.getElementById('ui-name').innerText="Lỗi hệ thống";document.getElementById('ui-desc').innerText="Vui lòng kiểm tra lại file info.json và các file .bdfd";console.error(e)}}function vipCopy(btn){const text=btn.parentElement.querySelector('.code-content').innerText;const iconCopy=btn.querySelector('.icon-copy');const iconCheck=btn.querySelector('.icon-check');const successUI=()=>{iconCopy.style.display='none';iconCheck.style.display='block';btn.style.background='var(--success)';btn.style.color='#000';setTimeout(()=>{iconCopy.style.display='block';iconCheck.style.display='none';btn.style.background='';btn.style.color=''},2000)};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(successUI).catch(()=>fallbackCopy(text,successUI))}else{fallbackCopy(text,successUI)}}function fallbackCopy(text,cb){const textArea=document.createElement("textarea");textArea.value=text;Object.assign(textArea.style,{position:"fixed",left:"-9999px",top:"0"});document.body.appendChild(textArea);textArea.focus();textArea.select();try{if(document.execCommand('copy'))cb();else throw new Error();}catch(err){document.getElementById('manual-text').value=text;document.getElementById('manual-modal').style.display='flex'}document.body.removeChild(textArea)}initSystem();</script></body></html>
